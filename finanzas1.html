  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDxrAJcH5AAxIAK2rRWD61aSQklaH--dT0",
      authDomain: "prsenorarepa.firebaseapp.com",
      projectId: "prsenorarepa",
      storageBucket: "prsenorarepa.firebasestorage.app",
      messagingSenderId: "55349021122",
      appId: "1:55349021122:web:e4c65b2f2911bd2c4eee5b",
      measurementId: "G-8JGY4PVMMV"
    };

    const COLECCION_MOVIMIENTOS = 'finanzas_movimientos';
    const CACHE_KEY = 'movimientos_finanzas_cache_v2';
    const CACHE_ANTERIOR_KEY = 'movimientos';
    const MIGRATION_KEY = 'movimientos_finanzas_migrados_v1';

    let indiceEdicion = null;
    let movimientos = JSON.parse(localStorage.getItem(CACHE_KEY)) || [];
    let grafico = null;
    let graficoCategorias = null;
    let firebaseApp = null;
    let firestoreDb = null;
    let firebaseAuth = null;
    let firebaseDisponible = false;
    let authDisponible = false;
    let usuarioAutenticado = null;

    const formulario = document.getElementById('formulario');
    const fotoInput = document.getElementById('foto');
    const vistaFoto = document.getElementById('vistaFoto');
    const botonGuardar = formulario.querySelector('button[type="submit"]');
    const estadoFirebase = document.getElementById('estadoFirebase');

    function setEstadoFirebase(texto, online = false) {
      if (!estadoFirebase) return;
      estadoFirebase.textContent = texto;
      estadoFirebase.classList.remove('online', 'offline');
      estadoFirebase.classList.add(online ? 'online' : 'offline');
    }

    function normalizarMovimiento(item) {
      return {
        id: item.id || null,
        tipo: item.tipo || 'gasto',
        monto: Number(item.monto || 0),
        categoria: item.categoria || '',
        fecha: item.fecha || '',
        descripcion: item.descripcion || '',
        imagen: item.imagen || item.imageUrl || null,
        createdAt: item.createdAt || null,
        updatedAt: item.updatedAt || null
      };
    }

    function ordenarMovimientos(data) {
      return [...data].sort((a, b) => {
        const fechaA = (a.fecha || '') + 'T00:00:00';
        const fechaB = (b.fecha || '') + 'T00:00:00';
        const timeA = new Date(fechaA).getTime() || 0;
        const timeB = new Date(fechaB).getTime() || 0;
        if (timeB !== timeA) return timeB - timeA;
        const updatedA = a.updatedAt?.seconds ? a.updatedAt.seconds * 1000 : 0;
        const updatedB = b.updatedAt?.seconds ? b.updatedAt.seconds * 1000 : 0;
        return updatedB - updatedA;
      });
    }

    function guardarCache() {
      localStorage.setItem(CACHE_KEY, JSON.stringify(movimientos));
    }

    function resetFormulario() {
      formulario.reset();
      document.getElementById('monto').value = '';
      vistaFoto.innerHTML = '';
      fotoInput.value = '';
      fotoInput.disabled = false;
      indiceEdicion = null;
      botonGuardar.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>Guardar Movimiento';
    }

    function formatearComoCOP(input) {
      let valor = input.value.replace(/\D/g, '');
      if (!valor) {
        input.value = '';
        return;
      }
      const numero = parseInt(valor, 10);
      input.value = numero.toLocaleString('es-CO', {
        style: 'currency',
        currency: 'COP',
        minimumFractionDigits: 0
      });
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('darkMode', document.body.classList.contains('dark-mode') ? 'true' : 'false');
    }

    function esErrorPermisoFirestore(error) {
      const codigo = String(error?.code || '');
      const mensaje = String(error?.message || '');
      return codigo.includes('permission-denied') || mensaje.includes('insufficient permissions') || mensaje.includes('Missing or insufficient permissions');
    }

    function setFormularioHabilitado(habilitado = true) {
      formulario.querySelectorAll('input, select, textarea, button').forEach(el => {
        if (el.id === 'foto') {
          el.disabled = !habilitado;
          return;
        }
        el.disabled = !habilitado;
      });
      botonGuardar.innerHTML = habilitado
        ? '<i class="bi bi-check-circle-fill me-1"></i>Guardar Movimiento'
        : '<i class="bi bi-lock-fill me-1"></i>Inicia sesión en Señor Arepa';
    }

    async function iniciarFirebase() {
      try {
        if (!firebase.apps.length) {
          firebaseApp = firebase.initializeApp(FIREBASE_CONFIG);
        } else {
          firebaseApp = firebase.app();
        }
        firestoreDb = firebase.firestore();
        firebaseAuth = firebase.auth(firebaseApp);
        firebaseDisponible = Boolean(firestoreDb);
        authDisponible = Boolean(firebaseAuth);
        setEstadoFirebase('Esperando sesión de Firebase...', false);
      } catch (error) {
        console.error('Error iniciando Firebase:', error);
        firebaseDisponible = false;
        authDisponible = false;
        setEstadoFirebase('Base de datos desconectada', false);
      }
    }

    async function esperarSesionFirebase(timeoutMs = 2500) {
      if (!authDisponible || !firebaseAuth) return null;
      if (firebaseAuth.currentUser) return firebaseAuth.currentUser;

      return await new Promise((resolve) => {
        let resuelto = false;
        const timer = setTimeout(() => {
          if (resuelto) return;
          resuelto = true;
          try { unsubscribe(); } catch (_) {}
          resolve(firebaseAuth.currentUser || null);
        }, timeoutMs);

        const unsubscribe = firebaseAuth.onAuthStateChanged((user) => {
          if (resuelto) return;
          resuelto = true;
          clearTimeout(timer);
          unsubscribe();
          resolve(user || null);
        });
      });
    }

    function mostrarVistaFoto(src) {
      if (!src) {
        vistaFoto.innerHTML = '';
        return;
      }
      vistaFoto.innerHTML = `<img src="${src}" alt="Comprobante" style="max-width: 100%; max-height: 180px; border-radius: 8px;" />`;
    }

    function leerArchivoComoDataURL(archivo) {
      return new Promise((resolve, reject) => {
        if (!archivo) {
          resolve(null);
          return;
        }

        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('No se pudo leer la imagen seleccionada.'));
        reader.readAsDataURL(archivo);
      });
    }

    async function cargarMovimientosDesdeFirestore() {
      if (!firebaseDisponible || !firestoreDb) {
        actualizarTodo();
        return;
      }

      if (!usuarioAutenticado) {
        setEstadoFirebase('Inicia sesión en Señor Arepa para sincronizar', false);
        movimientos = JSON.parse(localStorage.getItem(CACHE_KEY)) || JSON.parse(localStorage.getItem(CACHE_ANTERIOR_KEY)) || [];
        movimientos = ordenarMovimientos(movimientos.map(normalizarMovimiento));
        actualizarTodo();
        setFormularioHabilitado(false);
        return;
      }

      try {
        setEstadoFirebase('Cargando movimientos...', true);
        const snapshot = await firestoreDb.collection(COLECCION_MOVIMIENTOS).get();
        movimientos = snapshot.docs.map(doc => normalizarMovimiento({ id: doc.id, ...doc.data() }));
        movimientos = ordenarMovimientos(movimientos);
        guardarCache();
        actualizarTodo();
        setFormularioHabilitado(true);
        setEstadoFirebase(`Base de datos conectada · ${usuarioAutenticado.email || 'sesión activa'}`, true);

        if (!snapshot.empty) return;
        await migrarLocalStorageSiAplica();
      } catch (error) {
        console.error('Error cargando movimientos desde Firestore:', error);
        if (esErrorPermisoFirestore(error)) {
          setEstadoFirebase('Sin permisos para finanzas_movimientos', false);
        } else {
          setEstadoFirebase('Usando respaldo local', false);
        }
        movimientos = JSON.parse(localStorage.getItem(CACHE_KEY)) || JSON.parse(localStorage.getItem(CACHE_ANTERIOR_KEY)) || [];
        movimientos = ordenarMovimientos(movimientos.map(normalizarMovimiento));
        actualizarTodo();
      }
    }

    async function migrarLocalStorageSiAplica() {
      const yaMigrado = localStorage.getItem(MIGRATION_KEY) === 'true';
      const legacy = JSON.parse(localStorage.getItem(CACHE_ANTERIOR_KEY)) || [];
      if (yaMigrado || !legacy.length || !firebaseDisponible || !usuarioAutenticado) return;

      try {
        setEstadoFirebase('Migrando datos locales...', true);
        for (const item of legacy) {
          const base = normalizarMovimiento(item);
          const docRef = firestoreDb.collection(COLECCION_MOVIMIENTOS).doc();
          let imagen = null;

          if (base.imagen) {
            try {
              imagen = await convertirImagenABase64(base.imagen);
            } catch (error) {
              console.warn('No se pudo migrar una imagen local a Firestore:', error);
            }
          }

          await docRef.set({
            tipo: base.tipo,
            monto: Number(base.monto || 0),
            categoria: base.categoria,
            fecha: base.fecha,
            descripcion: base.descripcion,
            imagen,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }

        localStorage.setItem(MIGRATION_KEY, 'true');
        await cargarMovimientosDesdeFirestore();
      } catch (error) {
        console.error('Error migrando localStorage a Firestore:', error);
        setEstadoFirebase('Error al migrar datos locales', false);
      }
    }

    async function guardarMovimientoEnFirebase({ tipo, monto, categoria, fecha, descripcion, archivo }) {
      const estaEditando = indiceEdicion !== null && movimientos[indiceEdicion];
      const anterior = estaEditando ? movimientos[indiceEdicion] : null;
      const docRef = estaEditando && anterior.id
        ? firestoreDb.collection(COLECCION_MOVIMIENTOS).doc(anterior.id)
        : firestoreDb.collection(COLECCION_MOVIMIENTOS).doc();

      let imagen = anterior?.imagen || null;

      if (archivo) {
        imagen = await leerArchivoComoDataURL(archivo);
      }

      const payload = {
        tipo,
        monto,
        categoria,
        fecha,
        descripcion,
        imagen,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (!estaEditando) {
        payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      }

      await docRef.set(payload, { merge: true });
      return docRef.id;
    }

    formulario.addEventListener('submit', async function(e) {
      e.preventDefault();

      const tipo = document.getElementById('tipo').value;
      const montoTexto = document.getElementById('monto').value;
      const monto = parseFloat(montoTexto.replace(/[^0-9]/g, '')) || 0;
      const categoria = document.getElementById('categoria').value;
      const fecha = document.getElementById('fecha').value;
      const descripcion = document.getElementById('descripcion').value.trim();
      const archivo = fotoInput.files[0] || null;

      if (!fecha) {
        alert('Debes seleccionar una fecha.');
        return;
      }

      botonGuardar.disabled = true;
      botonGuardar.innerHTML = '<i class="bi bi-hourglass-split me-1"></i>Guardando...';

      try {
        if (!firebaseDisponible || !usuarioAutenticado) {
          throw new Error('No hay una sesión autenticada en Firebase');
        }

        await guardarMovimientoEnFirebase({ tipo, monto, categoria, fecha, descripcion, archivo });
        await cargarMovimientosDesdeFirestore();
        resetFormulario();
      } catch (error) {
        console.error('Error guardando movimiento:', error);
        setEstadoFirebase('Error guardando en Firebase', false);
        alert('No se pudo guardar en Firebase. Revisa las reglas o la conexión.');
      } finally {
        botonGuardar.disabled = false;
        if (indiceEdicion === null) {
          botonGuardar.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>Guardar Movimiento';
        } else {
          botonGuardar.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>Actualizar Movimiento';
        }
      }
    });

    function filtrarMovimientos() {
      const desde = document.getElementById('desde').value;
      const hasta = document.getElementById('hasta').value;
      const categoriaFiltro = document.getElementById('filtroCategoria').value.trim().toLowerCase();
      const tipoFiltro = document.getElementById('filtroTipo').value;

      const filtrados = movimientos.filter(m => {
        const fechaValida = (!desde || m.fecha >= desde) && (!hasta || m.fecha <= hasta);
        const categoriaValida = !categoriaFiltro || (m.categoria || '').toLowerCase().includes(categoriaFiltro);
        const tipoValido = !tipoFiltro || m.tipo === tipoFiltro;
        return fechaValida && categoriaValida && tipoValido;
      });

      actualizarTabla(filtrados);
      actualizarResumen(filtrados);
      actualizarGrafico(filtrados);
      generarResumenMensual(filtrados);
    }

    document.getElementById('filtroCategoria').addEventListener('input', filtrarMovimientos);

    function limpiarFiltros() {
      document.getElementById('filtroTipo').value = '';
      document.getElementById('desde').value = '';
      document.getElementById('hasta').value = '';
      document.getElementById('filtroCategoria').value = '';
      actualizarTodo();
    }

    function actualizarTodo(data = movimientos) {
      actualizarTabla(data);
      actualizarResumen(data);
      actualizarGrafico(data);
      generarResumenMensual(data);
    }

    function actualizarTabla(data = movimientos) {
      const tabla = document.getElementById('tablaMovimientos');
      tabla.innerHTML = '';

      data.forEach((m) => {
        const indexReal = movimientos.findIndex(item => item.id === m.id);
        const fila = document.createElement('tr');
        fila.innerHTML = `
          <td>${m.tipo}</td>
          <td>$${Number(m.monto || 0).toLocaleString('es-CO')}</td>
          <td>${m.categoria || ''}</td>
          <td>${m.fecha || ''}</td>
          <td>${m.descripcion || ''}</td>
          <td>${m.imagen ? `<a href="${m.imagen}" target="_blank" class="btn btn-sm btn-outline-primary">Ver</a>` : 'Sin imagen'}</td>
          <td>
            <button class="btn btn-warning btn-sm me-1" onclick="editarMovimiento(${indexReal})"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-danger btn-sm" onclick="eliminarMovimiento(${indexReal})"><i class="bi bi-trash"></i></button>
          </td>
        `;
        tabla.appendChild(fila);
      });
    }

    async function eliminarMovimiento(index) {
      const movimiento = movimientos[index];
      if (!movimiento) return;

      try {
        if (!firebaseDisponible || !usuarioAutenticado || !movimiento.id) {
          throw new Error('Movimiento sin sesión o sin id de Firestore');
        }

        await firestoreDb.collection(COLECCION_MOVIMIENTOS).doc(movimiento.id).delete();
        movimientos.splice(index, 1);
        movimientos = ordenarMovimientos(movimientos);
        guardarCache();
        actualizarTodo();
      } catch (error) {
        console.error('Error eliminando movimiento:', error);
        alert('No se pudo eliminar en Firebase.');
      }
    }

    function actualizarResumen(data = movimientos) {
      const ingresos = data.filter(m => m.tipo === 'ingreso').reduce((acc, m) => acc + Number(m.monto || 0), 0);
      const gastos = data.filter(m => m.tipo === 'gasto').reduce((acc, m) => acc + Number(m.monto || 0), 0);
      document.getElementById('totalIngresos').textContent = ingresos.toLocaleString('es-CO', { style: 'currency', currency: 'COP' });
      document.getElementById('totalGastos').textContent = gastos.toLocaleString('es-CO', { style: 'currency', currency: 'COP' });
      document.getElementById('balance').textContent = (ingresos - gastos).toLocaleString('es-CO', { style: 'currency', currency: 'COP' });
    }

    function actualizarGrafico(data = movimientos) {
      const ingresos = data.filter(m => m.tipo === 'ingreso').reduce((acc, m) => acc + Number(m.monto || 0), 0);
      const gastos = data.filter(m => m.tipo === 'gasto').reduce((acc, m) => acc + Number(m.monto || 0), 0);
      const ctx = document.getElementById('grafico').getContext('2d');
      if (grafico) grafico.destroy();
      grafico = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['Ingresos', 'Gastos'],
          datasets: [{ data: [ingresos, gastos], backgroundColor: ['#34d399', '#f87171'] }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      const categorias = {};
      data.forEach(m => {
        const categoria = m.categoria || 'Sin categoría';
        if (!categorias[categoria]) categorias[categoria] = 0;
        categorias[categoria] += Number(m.monto || 0);
      });

      if (graficoCategorias) graficoCategorias.destroy();
      const ctxCat = document.getElementById('graficoCategorias').getContext('2d');
      graficoCategorias = new Chart(ctxCat, {
        type: 'bar',
        data: {
          labels: Object.keys(categorias),
          datasets: [{
            label: 'Total por Categoría',
            data: Object.values(categorias),
            backgroundColor: '#facc15',
            borderRadius: 5
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: {
              ticks: {
                callback: value => '$' + Number(value).toLocaleString('es-CO')
              }
            }
          }
        }
      });
    }

    function editarMovimiento(index) {
      const m = movimientos[index];
      if (!m) return;
      indiceEdicion = index;

      document.getElementById('tipo').value = m.tipo;
      document.getElementById('monto').value = Number(m.monto || 0).toLocaleString('es-CO', {
        style: 'currency',
        currency: 'COP',
        minimumFractionDigits: 0
      });
      document.getElementById('categoria').value = m.categoria;
      document.getElementById('fecha').value = m.fecha;
      document.getElementById('descripcion').value = m.descripcion || '';
      fotoInput.value = '';
      fotoInput.disabled = false;
      mostrarVistaFoto(m.imagen);
      botonGuardar.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>Actualizar Movimiento';
      formulario.scrollIntoView({ behavior: 'smooth' });
    }

    fotoInput.addEventListener('change', function () {
      const archivo = this.files[0];
      if (!archivo) {
        if (indiceEdicion !== null && movimientos[indiceEdicion]?.imagen) {
          mostrarVistaFoto(movimientos[indiceEdicion].imagen);
        } else {
          mostrarVistaFoto(null);
        }
        return;
      }

      const lector = new FileReader();
      lector.onload = function (e) {
        mostrarVistaFoto(e.target.result);
      };
      lector.readAsDataURL(archivo);
    });

    function generarResumenMensual(data = movimientos) {
      const resumen = {};
      data.forEach(m => {
        if (!m.fecha) return;
        const mes = m.fecha.slice(0, 7);
        if (!resumen[mes]) resumen[mes] = { ingresos: 0, gastos: 0 };
        if (m.tipo === 'ingreso') resumen[mes].ingresos += Number(m.monto || 0);
        else resumen[mes].gastos += Number(m.monto || 0);
      });

      const cuerpo = document.getElementById('tablaResumenMensual');
      cuerpo.innerHTML = '';

      Object.entries(resumen)
        .sort((a, b) => b[0].localeCompare(a[0]))
        .forEach(([mes, datos]) => {
          const balance = datos.ingresos - datos.gastos;
          const fila = `
            <tr>
              <td>${mes}</td>
              <td>$${datos.ingresos.toLocaleString('es-CO')}</td>
              <td>$${datos.gastos.toLocaleString('es-CO')}</td>
              <td class="${balance < 0 ? 'text-danger' : 'text-success'}">$${balance.toLocaleString('es-CO')}</td>
            </tr>
          `;
          cuerpo.innerHTML += fila;
        });
    }

    async function convertirImagenABase64(imagen) {
      if (!imagen) return null;
      if (imagen.startsWith('data:image/')) return imagen;
      const response = await fetch(imagen);
      const blob = await response.blob();
      return await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function exportarExcel() {
      const workbook = new ExcelJS.Workbook();
      const sheet = workbook.addWorksheet('Movimientos');

      sheet.mergeCells('A1:E1');
      const titleCell = sheet.getCell('A1');
      titleCell.value = 'Gestor de Finanzas - Movimientos';
      titleCell.font = { size: 16, bold: true };
      titleCell.alignment = { horizontal: 'center' };

      sheet.addRow([]);
      const headerRow = sheet.addRow(['Tipo', 'Monto', 'Categoría', 'Fecha', 'Descripción']);
      sheet.autoFilter = { from: `A${headerRow.number}`, to: `E${headerRow.number}` };
      sheet.views = [{ state: 'frozen', ySplit: headerRow.number }];

      headerRow.eachCell((cell) => {
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: '1F4E78' } };
        cell.font = { bold: true, color: { argb: 'FFFFFF' } };
        cell.alignment = { horizontal: 'center' };
        cell.border = {
          top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' }
        };
      });

      let totalIngresos = 0;
      let totalGastos = 0;

      movimientos.forEach((m) => {
        const row = sheet.addRow([m.tipo, Number(m.monto || 0), m.categoria, m.fecha, m.descripcion || '']);
        row.getCell(2).numFmt = '"$"#,##0';
        if (sheet.rowCount % 2 === 0) {
          row.eachCell((cell) => {
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'F3F4F6' } };
          });
        }
        row.eachCell((cell) => {
          cell.border = {
            top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' }
          };
          cell.alignment = { vertical: 'middle' };
        });
        if (m.tipo === 'ingreso') totalIngresos += Number(m.monto || 0);
        if (m.tipo === 'gasto') totalGastos += Number(m.monto || 0);
      });

      const resumenStart = sheet.rowCount + 2;
      const ingresosRow = sheet.getRow(resumenStart);
      ingresosRow.getCell(1).value = 'TOTAL INGRESOS';
      ingresosRow.getCell(2).value = totalIngresos;
      ingresosRow.getCell(2).numFmt = '"$"#,##0';
      ingresosRow.font = { bold: true };

      const gastosRow = sheet.getRow(resumenStart + 1);
      gastosRow.getCell(1).value = 'TOTAL GASTOS';
      gastosRow.getCell(2).value = totalGastos;
      gastosRow.getCell(2).numFmt = '"$"#,##0';
      gastosRow.font = { bold: true };

      const netoRow = sheet.getRow(resumenStart + 2);
      netoRow.getCell(1).value = 'TOTAL NETO';
      netoRow.getCell(2).value = totalIngresos - totalGastos;
      netoRow.getCell(2).numFmt = '"$"#,##0';
      netoRow.font = { bold: true };
      netoRow.eachCell((cell) => {
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: '28A745' } };
        cell.font = { color: { argb: 'FFFFFF' } };
      });

      sheet.columns = [
        { width: 15 }, { width: 18 }, { width: 20 }, { width: 15 }, { width: 40 }
      ];

      const fecha = new Date();
      const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
      const nombreArchivo = `movimientos_${meses[fecha.getMonth()]}_${fecha.getFullYear()}.xlsx`;
      const buffer = await workbook.xlsx.writeBuffer();
      saveAs(new Blob([buffer]), nombreArchivo);
    }

    async function exportarExcelYZip() {
      await exportarExcel();
      const zip = new JSZip();
      const carpeta = zip.folder('imagenes_movimientos');
      const imagenes = movimientos.filter(m => m.imagen);

      for (let i = 0; i < imagenes.length; i++) {
        const m = imagenes[i];
        try {
          const response = await fetch(m.imagen);
          const blob = await response.blob();
          const ext = blob.type.split('/')[1] || 'jpg';
          const archivoNombre = `${m.fecha || `movimiento_${i + 1}`}_${m.tipo || 'movimiento'}.${ext}`;
          carpeta.file(archivoNombre, blob);
        } catch (error) {
          console.error('Error al descargar imagen:', m.imagen, error);
        }
      }

      if (imagenes.length > 0) {
        const zipContent = await zip.generateAsync({ type: 'blob' });
        saveAs(zipContent, 'imagenes_movimientos.zip');
      }
    }

    async function exportarExcelConImagenes() {
      const workbook = new ExcelJS.Workbook();
      const sheet = workbook.addWorksheet('Movimientos');

      sheet.mergeCells('A1:F1');
      const titleCell = sheet.getCell('A1');
      titleCell.value = 'Gestor de Finanzas - Movimientos';
      titleCell.font = { size: 16, bold: true };
      titleCell.alignment = { horizontal: 'center' };

      sheet.addRow([]);
      const headerRow = sheet.addRow(['Tipo', 'Monto', 'Categoría', 'Fecha', 'Descripción', 'Foto']);
      sheet.autoFilter = { from: 'A' + headerRow.number, to: 'F' + headerRow.number };

      headerRow.eachCell((cell) => {
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: '1F4E78' } };
        cell.font = { color: { argb: 'FFFFFF' }, bold: true };
        cell.alignment = { horizontal: 'center' };
        cell.border = {
          top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' }
        };
      });

      for (let i = 0; i < movimientos.length; i++) {
        const m = movimientos[i];
        const rowIndex = sheet.rowCount + 1;
        const row = sheet.addRow([m.tipo, Number(m.monto || 0), m.categoria, m.fecha, m.descripcion || '', '']);
        row.getCell(2).numFmt = '"$"#,##0';

        if (m.imagen) {
          try {
            const base64 = await convertirImagenABase64(m.imagen);
            const extension = base64.includes('image/png') ? 'png' : 'jpeg';
            const imageId = workbook.addImage({ base64, extension });
            sheet.addImage(imageId, { tl: { col: 5, row: rowIndex - 1 }, ext: { width: 100, height: 80 } });
            sheet.getRow(rowIndex).height = 60;
          } catch (error) {
            console.error('No se pudo incrustar la imagen en Excel:', error);
          }
        }
      }

      sheet.columns = [
        { width: 12 }, { width: 14 }, { width: 20 }, { width: 15 }, { width: 35 }, { width: 18 }
      ];

      const fecha = new Date();
      const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
      const nombreArchivo = `movimientos_con_fotos_${meses[fecha.getMonth()]}_${fecha.getFullYear()}.xlsx`;
      const buffer = await workbook.xlsx.writeBuffer();
      saveAs(new Blob([buffer]), nombreArchivo);
    }

    window.filtrarMovimientos = filtrarMovimientos;
    window.limpiarFiltros = limpiarFiltros;
    window.editarMovimiento = editarMovimiento;
    window.eliminarMovimiento = eliminarMovimiento;
    window.exportarExcel = exportarExcel;
    window.exportarExcelYZip = exportarExcelYZip;
    window.exportarExcelConImagenes = exportarExcelConImagenes;
    window.formatearComoCOP = formatearComoCOP;
    window.toggleDarkMode = toggleDarkMode;

    (async function init() {
      if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
      }
      movimientos = ordenarMovimientos((JSON.parse(localStorage.getItem(CACHE_KEY)) || []).map(normalizarMovimiento));
      actualizarTodo();
      setFormularioHabilitado(false);
      await iniciarFirebase();

      if (authDisponible && firebaseAuth) {
        usuarioAutenticado = await esperarSesionFirebase();
        firebaseAuth.onAuthStateChanged(async (user) => {
          usuarioAutenticado = user || null;
          if (usuarioAutenticado) {
            setFormularioHabilitado(true);
          } else {
            setFormularioHabilitado(false);
          }
          await cargarMovimientosDesdeFirestore();
        });
      } else {
        await cargarMovimientosDesdeFirestore();
      }
    })();
  </script>

</body>
